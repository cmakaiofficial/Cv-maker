<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume & Cover Letter Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Printable Paper Styles */
        .paper-a4 {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            position: relative;
        }

        /* Hide UI Elements on Print / PDF Export */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .paper-a4 {
                box-shadow: none !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .preview-container {
                padding: 0 !important;
                overflow: visible !important;
            }
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg shadow-md">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">DocuCraft AI Studio</span>
            </div>

            <!-- Mode Selector Tabs -->
            <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button id="tab-resume" onclick="switchDocumentType('resume')" class="px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-indigo-600 text-white shadow-sm">
                    Resume / CV
                </button>
                <button id="tab-cover" onclick="switchDocumentType('cover')" class="px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors text-slate-400 hover:text-white">
                    Cover Letter
                </button>
            </div>

            <!-- Download Button -->
            <button onclick="window.print()" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Export PDF</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 sm:p-6 gap-6 overflow-hidden">
        
        <!-- Left Panel: Controls & Input Form -->
        <div class="no-print w-full lg:w-1/2 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-h-[calc(100vh-6rem)]">
            
            <!-- Customization Bar -->
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap gap-4 items-center justify-between text-xs sm:text-sm">
                <div class="flex items-center space-x-2">
                    <label class="font-semibold text-slate-700">Theme Color:</label>
                    <input type="color" id="accentColor" value="#4f46e5" onchange="renderPreview()" class="w-7 h-7 rounded border border-slate-300 cursor-pointer">
                </div>
                <button onclick="openChatbot()" class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-md font-semibold text-xs transition-colors shadow-sm">
                    <i data-lucide="bot" class="w-4 h-4"></i>
                    <span>Open AI Assistant</span>
                </button>
            </div>

            <!-- Form Content Scroll Area -->
            <div id="formContainer" class="p-6 overflow-y-auto space-y-6 flex-1">
                
                <!-- Shared Personal Info -->
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4 text-indigo-600"></i> Personal Details
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                            <input type="text" id="fullName" value="Alex Morgan" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Target Title</label>
                            <input type="text" id="jobTitle" value="Senior Product Designer" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                            <input type="email" id="email" value="alex.morgan@example.com" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Phone</label>
                            <input type="text" id="phone" value="+1 (555) 234-5678" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Location</label>
                            <input type="text" id="location" value="New York, NY" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Portfolio / LinkedIn</label>
                            <input type="text" id="website" value="alexmorgan.design" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- RESUME FIELDS -->
                <div id="resumeFields" class="space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">Professional Summary</label>
                            <button onclick="aiGenerateSummary()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                                <i data-lucide="sparkles" class="w-3 h-3"></i> Auto-Generate
                            </button>
                        </div>
                        <textarea id="summary" rows="3" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">Creative and user-focused Senior Product Designer with 5+ years of experience crafting intuitive mobile and web applications. Adept at leading end-to-end design processes, user research, and cross-functional team collaboration.</textarea>
                    </div>

                    <!-- Experience -->
                    <div>
                        <div class="flex items-center justify-between border-b pb-2 mb-3">
                            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="briefcase" class="w-4 h-4 text-indigo-600"></i> Experience
                            </h2>
                            <button onclick="addExperienceField()" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Position
                            </button>
                        </div>
                        <div id="experienceList" class="space-y-4"></div>
                    </div>

                    <!-- Skills -->
                    <div>
                        <h2 class="text-base font-bold text-slate-900 border-b pb-2 mb-3 flex items-center gap-2">
                            <i data-lucide="award" class="w-4 h-4 text-indigo-600"></i> Skills
                        </h2>
                        <input type="text" id="skillsInput" value="UI/UX Design, Figma, User Research, Wireframing, Prototyping, Design Systems, HTML/CSS" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <!-- COVER LETTER FIELDS -->
                <div id="coverFields" class="space-y-6 hidden">
                    <div class="space-y-4">
                        <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
                            <i data-lucide="mail" class="w-4 h-4 text-indigo-600"></i> Recipient
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Hiring Manager</label>
                                <input type="text" id="recipientName" value="Samantha Reed" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Company</label>
                                <input type="text" id="companyName" value="DesignCraft Studio" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">Letter Body</label>
                            <button onclick="aiGenerateCoverLetter()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                                <i data-lucide="sparkles" class="w-3 h-3"></i> Auto-Generate
                            </button>
                        </div>
                        <textarea id="coverBody" rows="9" oninput="renderPreview()" class="w-full border border-slate-300 rounded-md p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none leading-relaxed">Dear Samantha Reed,

I am writing to express my strong interest in the Senior Product Designer position at DesignCraft Studio. With my background in leading user-centered design initiatives and creating scalable design systems, I am confident in my ability to bring immediate value to your team.

In my recent roles, I have consistently driven product engagement by aligning intuitive interface design with core business goals.

Thank you for your time and consideration.

Sincerely,
Alex Morgan</textarea>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Live Document Preview -->
        <div class="w-full lg:w-1/2 flex flex-col items-center overflow-y-auto preview-container max-h-[calc(100vh-6rem)] rounded-xl">
            <div id="paper" class="paper-a4 p-8 sm:p-12 text-slate-800 transition-all duration-200 text-sm"></div>
        </div>

    </div>

    <!-- AI CHATBOT DRAWER MODAL -->
    <div id="chatModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end hidden no-print">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col border-l border-slate-200">
            <!-- Chat Header -->
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="bot" class="w-5 h-5 text-indigo-400"></i>
                    <div>
                        <h3 class="font-bold text-sm">AI Assistant Chatbot</h3>
                        <p class="text-[10px] text-slate-400">Ask me to write, summarize, or edit your document</p>
                    </div>
                </div>
                <button onclick="closeChatbot()" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Quick AI Action Chips -->
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-wrap gap-1.5 text-xs">
                <button onclick="runQuickAiAction('summary')" class="bg-white border border-slate-300 hover:border-indigo-500 text-slate-700 px-2.5 py-1 rounded-full shadow-sm">
                    ✨ Generate Summary
                </button>
                <button onclick="runQuickAiAction('cover')" class="bg-white border border-slate-300 hover:border-indigo-500 text-slate-700 px-2.5 py-1 rounded-full shadow-sm">
                    ✉️ Draft Cover Letter
                </button>
                <button onclick="runQuickAiAction('bullets')" class="bg-white border border-slate-300 hover:border-indigo-500 text-slate-700 px-2.5 py-1 rounded-full shadow-sm">
                    💡 Suggest Action Verbs
                </button>
            </div>

            <!-- Chat Window -->
            <div id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs sm:text-sm">
                <div class="bg-indigo-50 border border-indigo-100 text-indigo-900 p-3 rounded-lg max-w-[90%]">
                    👋 Hi! I'm connected directly to your form. Type what job you are applying for, or tap one of the quick actions above to automatically generate content!
                </div>
            </div>

            <!-- Chat Input -->
            <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
                <input type="text" id="chatInput" placeholder="e.g., Write a bullet point for managing a team..." onkeydown="if(event.key==='Enter') sendChatMessage()" class="flex-1 border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-md font-medium text-sm">
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let currentDocType = 'resume';

        let experiences = [
            {
                role: 'Senior Product Designer',
                company: 'Creative Edge Media',
                dates: '2022 - Present',
                desc: 'Spearheaded end-to-end user experience redesign for enterprise SaaS platform. Streamlined design systems, reducing design-to-development handoff time by 30%.'
            }
        ];

        function switchDocumentType(type) {
            currentDocType = type;
            const tabResume = document.getElementById('tab-resume');
            const tabCover = document.getElementById('tab-cover');

            if (type === 'resume') {
                tabResume.className = "px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-indigo-600 text-white shadow-sm";
                tabCover.className = "px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors text-slate-400 hover:text-white";
                document.getElementById('resumeFields').classList.remove('hidden');
                document.getElementById('coverFields').classList.add('hidden');
            } else {
                tabCover.className = "px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-indigo-600 text-white shadow-sm";
                tabResume.className = "px-3 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors text-slate-400 hover:text-white";
                document.getElementById('coverFields').classList.remove('hidden');
                document.getElementById('resumeFields').classList.add('hidden');
            }

            renderPreview();
        }

        function addExperienceField() {
            experiences.push({ role: '', company: '', dates: '', desc: '' });
            renderFormLists();
            renderPreview();
        }

        function removeExperience(index) {
            experiences.splice(index, 1);
            renderFormLists();
            renderPreview();
        }

        function updateExp(index, field, value) {
            experiences[index][field] = value;
            renderPreview();
        }

        function renderFormLists() {
            const expList = document.getElementById('experienceList');
            expList.innerHTML = experiences.map((exp, i) => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2 text-xs relative">
                    <button onclick="removeExperience(${i})" class="absolute top-2 right-2 text-slate-400 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="Job Title" value="${exp.role}" oninput="updateExp(${i}, 'role', this.value)" class="border p-1.5 rounded w-full">
                        <input type="text" placeholder="Company Name" value="${exp.company}" oninput="updateExp(${i}, 'company', this.value)" class="border p-1.5 rounded w-full">
                    </div>
                    <input type="text" placeholder="Dates (e.g., 2021 - Present)" value="${exp.dates}" oninput="updateExp(${i}, 'dates', this.value)" class="border p-1.5 rounded w-full">
                    <textarea placeholder="Key Achievements" oninput="updateExp(${i}, 'desc', this.value)" class="border p-1.5 rounded w-full h-16">${exp.desc}</textarea>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Chatbot Integration Functions
        function openChatbot() {
            document.getElementById('chatModal').classList.remove('hidden');
        }

        function closeChatbot() {
            document.getElementById('chatModal').classList.add('hidden');
        }

        function aiGenerateSummary() {
            const title = document.getElementById('jobTitle').value || 'Professional';
            const name = document.getElementById('fullName').value || 'Candidate';
            const summaryText = `High-performing ${title} with a proven track record of driving strategic initiatives and operational excellence. Adept at cross-functional leadership, creative problem-solving, and delivering measurable business outcomes in fast-paced environments.`;
            
            document.getElementById('summary').value = summaryText;
            renderPreview();
            return summaryText;
        }

        function aiGenerateCoverLetter() {
            const title = document.getElementById('jobTitle').value || 'Applicant';
            const company = document.getElementById('companyName').value || 'your team';
            const name = document.getElementById('fullName').value || 'Applicant';
            
            const letterText = `Dear Hiring Manager,\n\nI am writing to express my strong enthusiasm for the ${title} position at ${company}. Having followed your recent growth, I am eager to apply my extensive background in project execution and team leadership to support your strategic goals.\n\nThroughout my career, I have consistently focused on delivering high-impact solutions and fostering collaborative work environments. I am confident that my experience aligns closely with your needs.\n\nThank you for reviewing my application. I look forward to the opportunity to connect.\n\nSincerely,\n${name}`;
            
            document.getElementById('coverBody').value = letterText;
            renderPreview();
            return letterText;
        }

        function runQuickAiAction(type) {
            const windowEl = document.getElementById('chatWindow');

            if (type === 'summary') {
                const summary = aiGenerateSummary();
                windowEl.innerHTML += `<div class="bg-indigo-50 text-indigo-900 p-3 rounded-lg border border-indigo-100">✨ <strong>Generated new Professional Summary!</strong> Updated your document automatically.</div>`;
            } else if (type === 'cover') {
                switchDocumentType('cover');
                aiGenerateCoverLetter();
                windowEl.innerHTML += `<div class="bg-indigo-50 text-indigo-900 p-3 rounded-lg border border-indigo-100">✉️ <strong>Generated Cover Letter!</strong> Switched preview tab to Cover Letter.</div>`;
            } else if (type === 'bullets') {
                windowEl.innerHTML += `<div class="bg-indigo-50 text-indigo-900 p-3 rounded-lg border border-indigo-100">💡 <strong>Strong Action Verbs:</strong><br>• <em>Management:</em> Spearheaded, Orchestrated, Overseen.<br>• <em>Technical:</em> Architected, Engineered, Implemented.<br>• <em>Impact:</em> Accelerated, Amplified, Streamlined.</div>`;
            }
            windowEl.scrollTop = windowEl.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const windowEl = document.getElementById('chatWindow');
            const query = input.value.trim();

            if (!query) return;

            windowEl.innerHTML += `<div class="bg-slate-200 text-slate-800 p-3 rounded-lg max-w-[85%] ml-auto">${query}</div>`;
            input.value = '';

            setTimeout(() => {
                let response = "I can help with that! Use the quick action buttons above or specify if you'd like me to update your summary or cover letter.";
                const q = query.toLowerCase();

                if (q.includes('summary') || q.includes('profile')) {
                    aiGenerateSummary();
                    response = "I've generated a new professional summary based on your target title and updated your document!";
                } else if (q.includes('cover') || q.includes('letter')) {
                    switchDocumentType('cover');
                    aiGenerateCoverLetter();
                    response = "I've drafted a cover letter for you and updated the Cover Letter view!";
                } else if (q.includes('skill')) {
                    response = "Tip: Keep your skills section focused on 6-10 high-impact technical keywords related directly to your job postings.";
                }

                windowEl.innerHTML += `<div class="bg-indigo-50 text-indigo-900 p-3 rounded-lg border border-indigo-100 max-w-[85%]">${response}</div>`;
                windowEl.scrollTop = windowEl.scrollHeight;
            }, 400);
        }

        // Preview Render Engine
        function renderPreview() {
            const paper = document.getElementById('paper');
            const color = document.getElementById('accentColor').value;

            const name = document.getElementById('fullName').value || 'Your Name';
            const title = document.getElementById('jobTitle').value || 'Your Title';
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('location').value;
            const website = document.getElementById('website').value;

            if (currentDocType === 'resume') {
                const summary = document.getElementById('summary').value;
                const skills = document.getElementById('skillsInput').value.split(',').map(s => s.trim()).filter(s => s);

                paper.innerHTML = `
                    <div class="border-b-2 pb-6 mb-6" style="border-color: ${color}">
                        <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-1">${name}</h1>
                        <p class="text-base font-semibold mb-3" style="color: ${color}">${title}</p>
                        <div class="flex flex-wrap gap-y-1 gap-x-4 text-xs text-slate-600">
                            ${email ? `<span>${email}</span>` : ''}
                            ${phone ? `<span>${phone}</span>` : ''}
                            ${location ? `<span>${location}</span>` : ''}
                            ${website ? `<span>${website}</span>` : ''}
                        </div>
                    </div>

                    ${summary ? `
                    <div class="mb-6">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Professional Summary</h2>
                        <p class="text-slate-700 leading-relaxed text-xs sm:text-sm">${summary}</p>
                    </div>
                    ` : ''}

                    ${experiences.length > 0 ? `
                    <div class="mb-6">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Work Experience</h2>
                        <div class="space-y-4">
                            ${experiences.map(exp => `
                                <div>
                                    <div class="flex justify-between items-baseline mb-1">
                                        <h3 class="font-bold text-slate-800 text-sm">${exp.role || 'Job Title'}</h3>
                                        <span class="text-xs text-slate-500">${exp.dates}</span>
                                    </div>
                                    <p class="text-xs font-semibold mb-1" style="color: ${color}">${exp.company}</p>
                                    <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${exp.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}

                    ${skills.length > 0 ? `
                    <div>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Skills</h2>
                        <div class="flex flex-wrap gap-1.5">
                            ${skills.map(skill => `
                                <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded text-xs font-medium border border-slate-200">${skill}</span>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                `;
            } else {
                const recName = document.getElementById('recipientName').value;
                const company = document.getElementById('companyName').value;
                const coverBody = document.getElementById('coverBody').value;

                paper.innerHTML = `
                    <div class="border-b-2 pb-6 mb-8" style="border-color: ${color}">
                        <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-1">${name}</h1>
                        <p class="text-base font-semibold mb-3" style="color: ${color}">${title}</p>
                        <div class="flex flex-wrap gap-y-1 gap-x-4 text-xs text-slate-600">
                            ${email ? `<span>${email}</span>` : ''}
                            ${phone ? `<span>${phone}</span>` : ''}
                            ${location ? `<span>${location}</span>` : ''}
                        </div>
                    </div>

                    <div class="mb-6 text-xs sm:text-sm text-slate-700 space-y-1">
                        ${recName ? `<p class="font-bold text-slate-900">${recName}</p>` : ''}
                        ${company ? `<p class="font-medium" style="color: ${color}">${company}</p>` : ''}
                    </div>

                    <div class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line space-y-4">
                        ${coverBody}
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderFormLists();
            renderPreview();
            lucide.createIcons();
        });
    </script>
</body>
</html>
